[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-agent"
version = "0.1.0"
description = "Email-based refund evaluation workflow with three memory layers"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.5.0",
    "groq>=0.13.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.8.0",
    "pymilvus>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
refund-agent = "refund_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]